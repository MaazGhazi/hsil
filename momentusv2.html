<style>:root{--bg:#f7f5f0;--fg:#1a1a1a;--muted:#6b6560;--border:#e0dcd5;--accent:#0A6847;--accent2:#E3F0ED;--card:#fff;--dark:#0c0f0e;--red:#c0392b;--gold:#d4a853}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
.fr{font-family:'Fraunces',serif}.mono{font-family:'JetBrains Mono',monospace}
@keyframes fadeUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes scoreFloat{0%{transform:translateY(0) scale(1);opacity:1}50%{transform:translateY(-30px) scale(1.3);opacity:.9}100%{transform:translateY(-70px) scale(.8);opacity:0}}
@keyframes comboPopIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@keyframes rankUp{0%{transform:scale(0) rotate(-20deg);opacity:0}50%{transform:scale(1.15) rotate(3deg);opacity:1}70%{transform:scale(.95) rotate(-1deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes confetti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
@keyframes xpBarPulse{0%{box-shadow:0 0 0 0 rgba(10,104,71,.4)}100%{box-shadow:0 0 0 12px rgba(10,104,71,0)}}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes badgeDrop{0%{transform:translateY(-30px) scale(0);opacity:0}60%{transform:translateY(5px) scale(1.1);opacity:1}100%{transform:translateY(0) scale(1)}}

function iou(a,b){const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y),x2=Math.min(a.x+a.w,b.x+b.w),y2=Math.min(a.y+a.h,b.y+b.h);const i=Math.max(0,x2-x1)*Math.max(0,y2-y1),u=a.w*a.h+b.w*b.h-i;return u===0?0:i/u}

<section style={{maxWidth:1100,margin:"0 auto",padding:"0 32px 60px"}}>
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:24}}>
<div onClick={()=>go("train")} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:14,padding:32,cursor:"pointer",transition:"transform .2s"}}
onMouseOver={e=>e.currentTarget.style.transform="translateY(-4px)"} onMouseOut={e=>e.currentTarget.style.transform="none"}>
<span style={{fontSize:28,display:"block",marginBottom:12}}>🎯</span>
<h3 className="fr" style={{fontSize:22,fontWeight:700,marginBottom:8}}>Student Training</h3>
<p style={{color:"var(--muted)",lineHeight:1.6,fontSize:14}}>Draw bounding boxes on real DICOM fluoroscopy. XP, combos, achievements, leaderboards, rank progression. 5 lives per round.</p></div>
<div onClick={()=>go("surgeon")} style={{background:"var(--dark)",borderRadius:14,padding:32,cursor:"pointer",transition:"transform .2s"}}
onMouseOver={e=>e.currentTarget.style.transform="translateY(-4px)"} onMouseOut={e=>e.currentTarget.style.transform="none"}>
<span style={{fontSize:28,display:"block",marginBottom:12}}>🔬</span>
<h3 className="fr" style={{fontSize:22,fontWeight:700,marginBottom:8,color:"#e0e0e0"}}>Surgeon Overlay</h3>
<p style={{color:"#7a8a7e",lineHeight:1.6,fontSize:14}}>Single-landmark AI detection on the C-arm feed. "Landmark Detected" with confidence score.</p></div></div></section>
<footer style={{maxWidth:1100,margin:"0 auto",padding:"24px 32px 40px",borderTop:"1px solid var(--border)"}}><span style={{fontSize:12,color:"var(--muted)"}}>Momentus · Anatomical Landmark AI</span></footer></div>)}

// ━━━━━━━━━━━━━━━━ TRAINING (GAMIFIED) ━━━━━━━━━━━━━━━━
function TrainView({go}){
const ref=useRef(null);
const[step,setStep]=useState(0);const[box,setBox]=useState(null);const[drawing,setDrawing]=useState(null);
const[checked,setChecked]=useState(false);const[score,setScore]=useState(null);
const[xp,setXp]=useState(0);const[streak,setStreak]=useState(0);const[bestStreak,setBestStreak]=useState(0);
const[bestScore,setBestScore]=useState(0);const[fastTime,setFastTime]=useState(999);
const[earned,setEarned]=useState(null);const[scores,setScores]=useState([]);const[done,setDone]=useState(false);
const[timer,setTimer]=useState(0);const[tOn,setTOn]=useState(false);
const[lives,setLives]=useState(5);const[total,setTotal]=useState(0);const[rounds,setRounds]=useState(0);
const[floats,setFloats]=useState([]);const[shake,setShake]=useState(false);
const[showConfetti,setShowConfetti]=useState(false);const[flash,setFlash]=useState(null);
const[combo,setCombo]=useState(null);const[achToast,setAchToast]=useState([]);
const[unlocked,setUnlocked]=useState([]);const[rankUpShow,setRankUpShow]=useState(null);
const[tab,setTab]=useState("play");const[prevRank,setPrevRank]=useState(null);

const c=C[step];
useEffect(()=>{if(!tOn)return;const id=setInterval(()=>setTimer(t=>+(t+.1).toFixed(1)),100);return()=>clearInterval(id)},[tOn]);
useEffect(()=>{if(!checked&&!done){setTimer(0);setTOn(true)}},[step,done]);

const getP=useCallback(e=>{const r=ref.current.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100}},[]);
const onD=e=>{e.preventDefault();if(checked)return;const p=getP(e);setDrawing({x:p.x,y:p.y,w:0,h:0});setBox(null)};
const onM=e=>{if(!drawing)return;const p=getP(e);setDrawing(d=>({...d,w:p.x-d.x,h:p.y-d.y}))};
const onU=()=>{if(!drawing)return;const n={x:drawing.w<0?drawing.x+drawing.w:drawing.x,y:drawing.h<0?drawing.y+drawing.h:drawing.y,w:Math.abs(drawing.w),h:Math.abs(drawing.h)};if(n.w>2&&n.h>2)setBox(n);setDrawing(null)};

const check=()=>{
if(!box)return;setTOn(false);
const p=Math.round(iou(c.gt,box)*100);setScore(p);setChecked(true);
const ok=p>=25;
const ns=ok?streak+1:0;
const mult=1+Math.min(ns,7)*.15;
const base=Math.round(p*1.5);
const spd=timer<3?50:timer<5?30:timer<8?15:timer<12?5:0;
const stk=ns>=3?Math.min(ns*12,100):0;
const perfect=p>=80?40:0;
const tot=Math.round((base+spd+stk+perfect)*mult);

setEarned({base,spd,stk,perfect,mult,tot,t:timer});
const oldRank=gR(xp);
setXp(x=>x+tot);setStreak(ns);setTotal(n=>n+1);
if(p>bestScore)setBestScore(p);if(ns>bestStreak)setBestStreak(ns);if(timer<fastTime)setFastTime(timer);

// Effects
if(ok){
setFlash("green");setTimeout(()=>setFlash(null),300);
if(ns>=2){setCombo(ns);setTimeout(()=>setCombo(null),1500)}
if(p>=80){setShowConfetti(true);setTimeout(()=>setShowConfetti(false),3000)}
setFloats(f=>[...f,{id:Date.now(),v:"+"+tot+" XP"}]);setTimeout(()=>setFloats(f=>f.slice(1)),1500);
}else{
setFlash("red");setTimeout(()=>setFlash(null),300);
setShake(true);setTimeout(()=>setShake(false),500);
setLives(l=>l-1);
}

// Check rank up
const newRank=gR(xp+tot);
if(newRank.n>oldRank.n){setPrevRank(oldRank);setRankUpShow(newRank);setTimeout(()=>setRankUpShow(null),3000)}

// Achievements
const stats={total:total+1,streak:ns,best:Math.max(p,bestScore),fast:Math.min(timer,fastTime),rounds:rounds+(step+1>=C.length?1:0),avgRound:0,bestStreak:Math.max(ns,bestStreak)};
const nw=ACHV.filter(a=>!unlocked.includes(a.id)&&a.ck(stats));
if(nw.length){setAchToast(nw);setUnlocked(u=>[...u,...nw.map(a=>a.id)]);setTimeout(()=>setAchToast([]),3000)}
};

const next=()=>{setScores(s=>[...s,{label:c.label,region:c.region,pct:score,proc:c.proc}]);
if(step+1>=C.length){setRounds(r=>r+1);setDone(true)}
else{setStep(s=>s+1);setBox(null);setDrawing(null);setChecked(false);setScore(null);setEarned(null)}};
const restart=()=>{setStep(0);setBox(null);setDrawing(null);setChecked(false);setScore(null);setEarned(null);setScores([]);setDone(false);setLives(5);setTab("play")};

const rank=gR(xp),nxt=gN(xp),xpPct=nxt?((xp-rank.min)/(nxt.min-rank.min))*100:100;

// Game over (no lives)
if(lives<=0&&!done){
const avg=scores.length?Math.round(scores.reduce((s,r)=>s+r.pct,0)/scores.length):0;
return(<div style={{maxWidth:480,margin:"0 auto",padding:"40px 16px",textAlign:"center",animation:"slideUp .4s"}}>
<Confetti show={false}/>
<div style={{fontSize:64,marginBottom:16}}>💀</div>
<h2 className="fr" style={{fontSize:32,fontWeight:900,color:"var(--red)",marginBottom:8}}>Game Over</h2>
<p style={{color:"var(--muted)",marginBottom:24}}>You ran out of lives. You scored {avg}% average across {scores.length} landmarks.</p>
<div style={{display:"flex",gap:10,justifyContent:"center"}}>
<button onClick={restart} style={{padding:"13px 28px",borderRadius:8,border:"none",background:"var(--accent)",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>Try Again</button>
<button onClick={()=>go("home")} style={{padding:"13px 20px",borderRadius:8,border:"1px solid var(--border)",background:"var(--card)",color:"var(--muted)",cursor:"pointer"}}>Home</button></div></div>)}

// Results
if(done){const avg=Math.round(scores.reduce((s,r)=>s+r.pct,0)/scores.length);
return(<div style={{maxWidth:500,margin:"0 auto",padding:"24px 16px",animation:"slideUp .4s"}}><Confetti show={avg>=60}/>
<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:32,textAlign:"center"}}>
<div style={{fontSize:48,marginBottom:8,animation:"heartBeat 1s ease"}}>{avg>=70?"🏆":avg>=50?"⭐":avg>=30?"👍":"📚"}</div>
<div className="fr" style={{fontSize:56,fontWeight:900,color:avg>=50?"var(--accent)":avg>=25?"var(--gold)":"var(--red)",lineHeight:1}}>{avg}%</div>
<p style={{fontSize:13,color:"var(--muted)",marginTop:8}}>Round accuracy</p>
<div style={{display:"flex",justifyContent:"center",gap:16,margin:"16px 0",padding:"12px 0",borderTop:"1px solid var(--border)",borderBottom:"1px solid var(--border)"}}>
<div><div className="mono" style={{fontSize:18,fontWeight:800,color:"var(--accent)"}}>{xp}</div><div style={{fontSize:10,color:"var(--muted)"}}>Total XP</div></div>
<div><div className="mono" style={{fontSize:18,fontWeight:800,color:"var(--gold)"}}>{bestStreak}</div><div style={{fontSize:10,color:"var(--muted)"}}>Best Streak</div></div>
<div><div style={{fontSize:18}}>{rank.i}</div><div style={{fontSize:10,color:"var(--muted)"}}>{rank.t}</div></div>
<div><div style={{fontSize:18}}>❤️×{lives}</div><div style={{fontSize:10,color:"var(--muted)"}}>Lives Left</div></div></div>
<div style={{display:"flex",flexDirection:"column",gap:6,textAlign:"left"}}>{scores.map((s,i)=>(
<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"var(--bg)",borderRadius:8}}>
<span className="mono" style={{fontSize:11,color:"var(--muted)",width:16}}>{i+1}</span><div style={{flex:1}}><span style={{fontSize:12}}>{s.label}</span><div style={{fontSize:10,color:"var(--muted)"}}>{s.region}</div></div>
<span className="mono" style={{fontSize:13,fontWeight:700,color:s.pct>=50?"var(--accent)":s.pct>=25?"var(--gold)":"var(--red)"}}>{s.pct}%</span></div>))}</div>
<div style={{display:"flex",gap:10,marginTop:20}}><button onClick={restart} style={{flex:1,padding:13,borderRadius:8,border:"none",background:"var(--accent)",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>Next Round</button>
<button onClick={()=>go("home")} style={{padding:"13px 20px",borderRadius:8,border:"1px solid var(--border)",background:"var(--card)",color:"var(--muted)",cursor:"pointer"}}>Home</button></div></div></div>)}

// Leaderboard tab
if(tab==="lb"){const all=[...LB,{name:"You",xp}].sort((a,b)=>b.xp-a.xp);
return(<div style={{maxWidth:500,margin:"0 auto",padding:16}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
<button onClick={()=>setTab("play")} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer"}}>← Back</button>
<span className="mono" style={{fontSize:11,color:"var(--muted)",letterSpacing:1}}>LEADERBOARD</span></div>
{all.map((p,i)=>{const me=p.name==="You";return(
<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:me?"var(--accent2)":"var(--card)",border:"1px solid "+(me?"var(--accent)":"var(--border)"),borderRadius:8,marginBottom:6}}>
<span className="fr" style={{fontSize:16,fontWeight:800,color:i===0?"var(--gold)":"var(--muted)",width:24}}>#{i+1}</span>
<span style={{flex:1,fontSize:13,fontWeight:me?700:400,color:me?"var(--accent)":"var(--fg)"}}>{p.name}</span>
<span className="mono" style={{fontSize:11,color:"var(--muted)"}}>{gR(p.xp).i}</span>
<span className="mono" style={{fontSize:12,fontWeight:700,color:me?"var(--accent)":"var(--muted)"}}>{p.xp}</span></div>)})}</div>)}

// Achievements tab
if(tab==="ach"){return(<div style={{maxWidth:500,margin:"0 auto",padding:16}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
<button onClick={()=>setTab("play")} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer"}}>← Back</button>
<span className="mono" style={{fontSize:11,color:"var(--muted)",letterSpacing:1}}>ACHIEVEMENTS · {unlocked.length}/{ACHV.length}</span></div>
{ACHV.map(a=>{const u=unlocked.includes(a.id);return(
<div key={a.id} style={{display:"flex",alignItems:"center",gap:12,padding:"14px",background:u?"var(--accent2)":"var(--card)",border:"1px solid "+(u?"var(--accent)33":"var(--border)"),borderRadius:10,marginBottom:6,opacity:u?1:.5}}>
<span style={{fontSize:24}}>{a.icon}</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:u?"var(--accent)":"var(--fg)"}}>{a.label}</div><div style={{fontSize:11,color:"var(--muted)"}}>{a.desc}</div></div>
{u&&<span style={{color:"var(--accent)",fontSize:16}}>✓</span>}</div>)})}</div>)}

// MAIN GAME
return(<div style={{maxWidth:540,margin:"0 auto",padding:16,position:"relative"}}>
<Confetti show={showConfetti}/>

{/* Flash overlay */}
{flash&&<div style={{position:"fixed",inset:0,background:flash==="green"?"rgba(10,104,71,.15)":"rgba(192,57,43,.15)",zIndex:50,pointerEvents:"none",animation:"flash .3s ease-out forwards"}}/>}

{/* Combo popup */}
{combo&&<div style={{position:"fixed",top:"30%",left:"50%",transform:"translateX(-50%)",zIndex:60,pointerEvents:"none",animation:"comboPopIn .4s ease"}}>
<div style={{textAlign:"center"}}><div className="fr" style={{fontSize:Math.min(40+combo*6,80),fontWeight:900,color:"var(--accent)",textShadow:"0 2px 20px rgba(10,104,71,.3)"}}>{combo}x</div>
<div className="mono" style={{fontSize:14,color:"var(--gold)",fontWeight:700,letterSpacing:2}}>COMBO</div></div></div>}

{/* Rank up */}
{rankUpShow&&<div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.4)",zIndex:70}}>
<div style={{background:"var(--card)",borderRadius:20,padding:"40px 48px",textAlign:"center",animation:"rankUp .6s ease",maxWidth:320}}>
<div style={{fontSize:48,marginBottom:8}}>{rankUpShow.i}</div>
<div className="mono" style={{fontSize:12,color:"var(--accent)",letterSpacing:2,marginBottom:4}}>RANK UP!</div>
<div className="fr" style={{fontSize:28,fontWeight:900}}>{rankUpShow.t}</div>
<p style={{fontSize:13,color:"var(--muted)",marginTop:8}}>Level {rankUpShow.n} unlocked</p></div></div>}

{/* Achievement toasts */}
{achToast.length>0&&<div style={{position:"fixed",top:20,right:20,zIndex:80,display:"flex",flexDirection:"column",gap:8}}>
{achToast.map(a=>(<div key={a.id} style={{background:"var(--card)",border:"1px solid var(--accent)",borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:10,animation:"badgeDrop .5s ease",boxShadow:"0 8px 24px rgba(0,0,0,.15)",minWidth:200}}>
<span style={{fontSize:24}}>{a.icon}</span><div><div className="mono" style={{fontSize:10,color:"var(--accent)",letterSpacing:1}}>UNLOCKED</div><div style={{fontSize:13,fontWeight:600}}>{a.label}</div></div></div>))}</div>}

{/* Top bar */}
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
<button onClick={()=>go("home")} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:13}}>← Home</button>
<div style={{display:"flex",alignItems:"center",gap:12}}>
{/* Lives */}
<div style={{display:"flex",gap:2}}>{Array.from({length:5}).map((_,i)=>(<span key={i} style={{fontSize:14,opacity:i<lives?1:.2,transition:"opacity .3s",animation:i===lives?"heartBeat .6s":"none"}}>❤️</span>))}</div>
{/* Nav icons */}
<span onClick={()=>setTab("ach")} style={{cursor:"pointer",fontSize:16}} title="Achievements">🏆</span>
<span onClick={()=>setTab("lb")} style={{cursor:"pointer",fontSize:16}} title="Leaderboard">📊</span>
</div></div>

{/* XP bar */}
<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",marginBottom:10}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
<div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:14}}>{rank.i}</span><span style={{fontSize:12,fontWeight:600}}>{rank.t}</span>
{streak>=2&&<span style={{fontSize:11,color:"var(--gold)",animation:streak>=5?"heartBeat 1s infinite":"none"}}>🔥{streak}</span>}</div>
<span className="mono" style={{fontSize:12,color:"var(--accent)",fontWeight:700}}>{xp} XP</span></div>
<div style={{height:4,background:"var(--border)",borderRadius:2,overflow:"hidden"}}><div style={{width:Math.min(xpPct,100)+"%",height:"100%",background:"var(--accent)",borderRadius:2,transition:"width .5s",animation:earned?"xpBarPulse .5s":"none"}}/></div>
{nxt&&<div className="mono" style={{fontSize:9,color:"var(--muted)",marginTop:2,textAlign:"right"}}>{nxt.min-xp} to {nxt.t}</div>}
</div>

{/* Progress */}
<div style={{display:"flex",gap:4,marginBottom:12}}>{C.map((l,i)=>(<div key={l.id} style={{flex:1,height:5,borderRadius:3,background:i<step?"var(--accent)":i===step?"var(--accent)55":"var(--border)",transition:"all .3s"}}/>))}</div>

{/* Card */}
<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden",marginBottom:14,animation:shake?"shakeX .5s":"none"}}>
<div style={{padding:"14px 18px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
<div><span style={{fontSize:15,fontWeight:600}}>{c.label}</span>
<div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{c.region} · {c.proc} · {step+1}/{C.length}</div></div>
<div className="mono" style={{fontSize:16,fontWeight:800,color:timer<5?"var(--accent)":timer<10?"var(--gold)":"var(--red)",animation:timer>=10?"timerPulse .5s infinite":"none"}}>{timer.toFixed(1)}s</div></div>

<div ref={ref} onMouseDown={onD} onMouseMove={onM} onMouseUp={onU} onMouseLeave={onU}
style={{position:"relative",width:"100%",aspectRatio:"1/1",cursor:checked?"default":"crosshair",userSelect:"none",background:"#000"}}>
<img src={c.img} alt="" draggable={false} style={{width:"100%",height:"100%",objectFit:"cover",display:"block",pointerEvents:"none"}}/>
{box&&<div style={{position:"absolute",left:box.x+"%",top:box.y+"%",width:box.w+"%",height:box.h+"%",border:"2.5px solid var(--accent)",borderRadius:4,background:"rgba(10,104,71,.12)",pointerEvents:"none"}}><span style={{position:"absolute",top:-17,left:2,fontSize:10,color:"var(--accent)",fontWeight:600,textShadow:"0 1px 4px #000"}}>Your label</span></div>}
{drawing&&<div style={{position:"absolute",left:(drawing.w<0?drawing.x+drawing.w:drawing.x)+"%",top:(drawing.h<0?drawing.y+drawing.h:drawing.y)+"%",width:Math.abs(drawing.w)+"%",height:Math.abs(drawing.h)+"%",border:"2px dashed var(--accent)",borderRadius:4,pointerEvents:"none"}}/>}
{checked&&<div style={{position:"absolute",left:c.gt.x+"%",top:c.gt.y+"%",width:c.gt.w+"%",height:c.gt.h+"%",border:"2px dashed rgba(255,255,255,.45)",borderRadius:4,pointerEvents:"none"}}><span style={{position:"absolute",bottom:-15,right:2,fontSize:9,color:"rgba(255,255,255,.5)"}}>Ground Truth</span></div>}

{/* Floating XP */}
{floats.map(f=>(<div key={f.id} style={{position:"absolute",top:"40%",left:"50%",transform:"translateX(-50%)",pointerEvents:"none",zIndex:10,animation:"scoreFloat 1.5s ease-out forwards"}}>
<span className="mono" style={{fontSize:20,fontWeight:800,color:"#fff",textShadow:"0 2px 12px rgba(10,104,71,.6)"}}>{f.v}</span></div>))}

<div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,.65))",padding:"24px 14px 10px"}}>
<span style={{fontSize:11,color:"rgba(255,255,255,.7)"}}>{!checked?"💡 "+c.hint:""}</span></div></div></div>

{/* Feedback */}
{checked&&earned&&(<div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:16,marginBottom:14,animation:"slideUp .3s"}}>
<div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:8}}>
<div style={{display:"flex",alignItems:"center",gap:8}}><span className="fr" style={{fontSize:28,fontWeight:900,color:score>=50?"var(--accent)":score>=25?"var(--gold)":"var(--red)"}}>{score}%</span>
<span style={{fontSize:12,color:"var(--muted)"}}>{score>=80?"🔥 Perfect!":score>=50?"Excellent":score>=25?"Good":score<25&&lives>0?"Miss (-1 ❤️)":"Miss"}</span></div>
<span className="mono" style={{fontSize:14,fontWeight:700,color:"var(--accent)"}}>+{earned.tot} XP</span></div>
<p style={{fontSize:13,color:"var(--muted)",lineHeight:1.6,margin:"0 0 10px"}}>{score>=25?c.good:c.bad}</p>
<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
{earned.base>0&&<div className="mono" style={{fontSize:10,color:"var(--muted)",padding:"3px 8px",background:"var(--bg)",borderRadius:4}}>Accuracy +{earned.base}</div>}
{earned.spd>0&&<div className="mono" style={{fontSize:10,color:"var(--gold)",padding:"3px 8px",background:"#fdf6e8",borderRadius:4}}>⚡ Speed +{earned.spd}</div>}
{earned.stk>0&&<div className="mono" style={{fontSize:10,color:"#c55",padding:"3px 8px",background:"#fef0ef",borderRadius:4}}>🔥 Streak +{earned.stk}</div>}
{earned.perfect>0&&<div className="mono" style={{fontSize:10,color:"var(--accent)",padding:"3px 8px",background:"var(--accent2)",borderRadius:4}}>💎 Perfect +{earned.perfect}</div>}
{earned.mult>1&&<div className="mono" style={{fontSize:10,color:"#7a5ac0",padding:"3px 8px",background:"#f3f0fa",borderRadius:4}}>×{earned.mult.toFixed(2)}</div>}
</div></div>)}

{!checked?(<div style={{display:"flex",gap:8}}>
<button onClick={check} disabled={!box} style={{flex:1,padding:13,borderRadius:8,border:"none",background:box?"var(--accent)":"var(--border)",color:box?"#fff":"var(--muted)",fontSize:14,fontWeight:600,cursor:box?"pointer":"not-allowed"}}>Check</button>
{box&&<button onClick={()=>setBox(null)} style={{padding:"13px 18px",borderRadius:8,border:"1px solid var(--border)",background:"var(--card)",color:"var(--muted)",cursor:"pointer"}}>↺</button>}</div>):(
<button onClick={next} style={{width:"100%",padding:13,borderRadius:8,border:"none",background:"var(--accent)",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer"}}>{step+1>=C.length?"View Results":"Next Image →"}</button>)}
</div>)}

// ━━━ SURGEON ━━━
function SurgeonView({go}){
const[on,setOn]=useState(false);const[conf,setConf]=useState(null);const[loading,setLoading]=useState(false);const[sel,setSel]=useState(0);
const lms=[{id:"scotty",label:"Scotty Dog",img:I_OBL,gt:{x:38,y:24,w:28,h:42},c:"#0A6847",proc:"Spine injections"},
{id:"teardrop",label:"Teardrop",img:I_TEAR,gt:{x:42,y:48,w:8,h:12},c:"#2E8B57",proc:"Hip positioning"},
{id:"shenton",label:"Shenton's Line",img:I_HIP,gt:{x:30,y:42,w:22,h:20},c:"#4682B4",proc:"Alignment check"},
{id:"pedicle",label:"Pedicle",img:I_OBL,gt:{x:45,y:28,w:12,h:12},c:"#d4a853",proc:"Screw targeting"},
{id:"femoral",label:"Femoral Neck",img:I_HIPLAT,gt:{x:32,y:28,w:26,h:36},c:"#8B4513",proc:"Trajectory guidance"}];
const lm=lms[sel];
const toggle=()=>{if(on){setOn(false);setConf(null);return}setLoading(true);
setTimeout(()=>{setOn(true);setConf((85+Math.random()*12).toFixed(1));setLoading(false)},1200)};

return(<div style={{background:"var(--dark)",minHeight:"100vh",color:"#d0d0d0"}}><div style={{maxWidth:760,margin:"0 auto",padding:"20px 16px"}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
<button onClick={()=>go("home")} style={{background:"none",border:"none",color:"#5a6a62",cursor:"pointer",fontSize:13}}>← Home</button>
<div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:24,height:24,borderRadius:6,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center"}}><span className="fr" style={{color:"#fff",fontSize:13,fontWeight:900}}>M</span></div>
<span className="mono" style={{fontSize:10,color:"#3a4a42",letterSpacing:1}}>SURGEON MODE</span></div></div>
<div style={{display:"flex",gap:6,marginBottom:16,overflowX:"auto"}}>
{lms.map((l,i)=>(<button key={l.id} onClick={()=>{setSel(i);setOn(false);setConf(null)}} style={{padding:"8px 14px",borderRadius:6,border:sel===i?"1px solid "+l.c+"44":"1px solid #1e2a25",background:sel===i?"#141a17":"transparent",color:sel===i?l.c:"#5a6a62",fontSize:11,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"'JetBrains Mono'"}}>{l.label}</button>))}</div>
<div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
<div style={{position:"relative",flex:"1 1 400px",aspectRatio:"1/1",borderRadius:10,overflow:"hidden",background:"#000"}}>
<img src={lm.img} alt="" draggable={false} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
{on&&conf&&(<><div style={{position:"absolute",left:lm.gt.x+"%",top:lm.gt.y+"%",width:lm.gt.w+"%",height:lm.gt.h+"%",border:"2.5px solid "+lm.c,borderRadius:4,background:lm.c+"18",zIndex:2,animation:"slideUp .4s"}}>
<div style={{position:"absolute",top:-26,left:"50%",transform:"translateX(-50%)",background:"#000d",backdropFilter:"blur(8px)",padding:"4px 12px",borderRadius:6,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:8}}>
<span className="mono" style={{fontSize:10,color:lm.c,fontWeight:700}}>{lm.label}</span><span className="mono" style={{fontSize:10,color:"#fff9"}}>{conf}%</span></div></div>
<div style={{position:"absolute",bottom:16,left:16,right:16,background:"#000d",backdropFilter:"blur(12px)",borderRadius:10,padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:3,animation:"slideUp .5s ease",animationDelay:".2s",animationFillMode:"both"}}>
<div><div style={{fontSize:14,fontWeight:600,color:"#e0e0e0"}}>Landmark Detected</div><div className="mono" style={{fontSize:11,color:"#7a8a82",marginTop:2}}>{lm.label} · {lm.proc}</div></div>
<div style={{textAlign:"right"}}><div className="mono" style={{fontSize:24,fontWeight:800,color:lm.c}}>{conf}%</div><div className="mono" style={{fontSize:9,color:"#5a6a62"}}>confidence</div></div></div></>)}
{loading&&<div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#000a",zIndex:5,gap:12}}>
<div style={{width:32,height:32,border:"2.5px solid #222",borderTopColor:lm.c,borderRadius:"50%",animation:"spin .7s linear infinite"}}/><span className="mono" style={{fontSize:11,color:"#5a6a62"}}>Detecting {lm.label}...</span></div>}
<div style={{position:"absolute",top:12,left:12,display:"flex",alignItems:"center",gap:7,background:"#000a",backdropFilter:"blur(8px)",padding:"5px 12px",borderRadius:6,zIndex:4}}>
<div style={{width:7,height:7,borderRadius:"50%",background:on?lm.c:"#444",animation:on?"pulse 2s infinite":"none"}}/><span className="mono" style={{fontSize:10,color:"#8a9a92"}}>{on?"AI OVERLAY":"NATIVE"}</span></div></div>
<div style={{flex:"1 1 200px",minWidth:200,display:"flex",flexDirection:"column",gap:12}}>
<button onClick={toggle} style={{width:"100%",padding:14,borderRadius:8,border:on?"1px solid "+lm.c+"30":"none",cursor:"pointer",fontFamily:"'JetBrains Mono'",fontSize:12,fontWeight:700,letterSpacing:1,background:on?"var(--dark)":lm.c,color:on?lm.c:"#fff"}}>
{loading?"ANALYZING...":on?"DISABLE OVERLAY":"DETECT "+lm.label.toUpperCase()}</button>
{on&&conf&&(<div style={{background:"#141a17",border:"1px solid #1e2a25",borderRadius:10,padding:16,animation:"slideUp .3s"}}>
<div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:13,fontWeight:600,color:"#c0c0c0"}}>{lm.label}</span><span className="mono" style={{fontSize:18,fontWeight:800,color:lm.c}}>{conf}%</span></div>
<div style={{height:4,background:"#1a2420",borderRadius:2,overflow:"hidden",marginBottom:10}}><div style={{width:conf+"%",height:"100%",background:lm.c,borderRadius:2}}/></div>
<div className="mono" style={{fontSize:10,color:"#5a6a62"}}>{lm.proc}</div></div>)}
{!on&&!loading&&<p style={{fontSize:13,color:"#5a6a62",lineHeight:1.6,margin:"8px 0"}}>Select a landmark, then press Detect.</p>}
</div></div></div></div>)}

function App(){const[p,setP]=useState("home");
if(p==="train")return<TrainView go={setP}/>;if(p==="surgeon")return<SurgeonView go={setP}/>;return<Landing go={setP}/>}
ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script></body></html>
